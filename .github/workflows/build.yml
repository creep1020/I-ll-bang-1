
name: Build Ilbbang Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check Manifest
        run: |
          echo "----- Actual Manifest File -----"
          cat -A app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML syntax OK')"

      - name: Build APK
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Sign APK with persistent key
        env:
          KEY_B64: ${{ secrets.ILBBANG_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.ILBBANG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/ilbbang.p12"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SIGNER" sign --ks "$RUNNER_TEMP/ilbbang.p12" --ks-type PKCS12 --ks-key-alias ilbbang --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/app-signed.apk" app/build/outputs/apk/debug/app-debug.apk
          "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/app-signed.apk"
          mv "$RUNNER_TEMP/app-signed.apk" app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/ilbbang.p12"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IlbbangAndroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
